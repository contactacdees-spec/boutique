<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Boutique TS</title>
<style>
  :root{--B1:#0D2E1E;--B2:#14472C;--B3:#1F6B41;--O2:#E86A17;--O4:#FDEBDA;--ICE:#D9E7DE;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--B1);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{max-width:720px;width:100%;text-align:center;}
  .logo{width:76px;height:76px;border-radius:22px;background:var(--O2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 10px 30px rgba(232,106,23,.35);font-size:34px;}
  h1{color:#fff;font-size:30px;font-weight:800;letter-spacing:.5px;margin-bottom:6px;}
  p.sub{color:var(--ICE);font-size:14px;margin-bottom:40px;}
  .cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  a.card{flex:1;min-width:220px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:30px 20px;text-decoration:none;color:#fff;transition:transform .15s, background .15s, border-color .15s;}
  a.card:hover{background:rgba(255,255,255,.1);transform:translateY(-3px);border-color:var(--O2);}
  a.card .ico{width:48px;height:48px;border-radius:50%;background:rgba(232,106,23,.18);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px;}
  a.card .t{font-weight:700;font-size:16px;margin-bottom:6px;}
  a.card .d{font-size:12.5px;color:var(--ICE);line-height:1.5;}
  footer{margin-top:44px;color:rgba(255,255,255,.35);font-size:12px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🏪</div>
    <h1>Boutique TS</h1>
    <p class="sub">Choisissez l'application à ouvrir sur cet appareil</p>
    <div class="cards">
      <a class="card" href="/caisse.html">
        <div class="ico">🖥️</div>
        <div class="t">Caisse</div>
        <div class="d">Poste principal — ventes, achats, stock, dépenses, rapports</div>
      </a>
      <a class="card" href="/scan.html">
        <div class="ico">📱</div>
        <div class="t">Scan Vente</div>
        <div class="d">Téléphone personnel de la commerciale — scanner et enregistrer une vente</div>
      </a>
    </div>
    <footer>Boutique TS — données centralisées en temps réel</footer>
  </div>
</body>
</html>
